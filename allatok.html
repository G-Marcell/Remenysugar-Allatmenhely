<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remény Sugár Állatmenhely - Állatok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="egyszeru-oldal">


    <header class="egyszeru-header">
        <div class="logo">
            <span>🐾</span>
            <div>
                <h2>Remény Sugár</h2>
                <p>ÁLLATMENHELY</p>
            </div>
        </div>

        <!-- KÖZÉPSŐ KERESŐMEZŐ -->
        <div class="kozepso-kereso">
            <input type="text" id="eleresKereso" placeholder="Keresés....">
        </div>

        <a href="remenysugar.html" class="kereses">Vissza a főoldalra →</a>

    </header>


    <main class="tartalom-keret">
        <div class="allat-racs">
            <!-- Az állatok kártyái ide kerülnek a JavaScript segítségével -->
        </div>

        <p class="galeria-megjegyzes">
            Vidd a képre az egeret a részletekért, kattints a teljes adatlapért.
        </p>
    </main>

   
    <div class="adatlap-hatter rejtett" id="adatlapHatter">
        <div class="reszletes-adatlap-kontener">
            
            
            <div class="adatlap-fejlec">
                <button type="button" class="vissza-gomb" id="adatlapVissza">← Vissza az állatokhoz</button>
                <span class="adatlap-cimke" id="adatlapTipus">KUTYA</span>
            </div>

            
            <div class="adatlap-tartalom-grid">
                <div class="adatlap-kep-doboz">
                    <img id="adatlapKep" src="" alt="Állat képe">
                </div>

                <div class="adatlap-info-doboz">
                    <h1 id="adatlapNev">Név</h1>
                    
                    <div class="tulajdonsagok-lista">
                        <p><strong>Életkor:</strong> <span id="adatlapKor">-</span></p>
                        <p><strong>Menhelyre érkezett:</strong> <span id="adatlapErkezes">-</span></p>
                    </div>

                    <h3>Személyiség & Leírás</h3>
                    <p id="adatlapSzemelyiseg" class="szemelyiseg-szoveg">
                        Itt jelenik meg az állat részletes leírása...
                    </p>

                    
                    <div class="adatlap-akciogombok">
                        <button type="button" class="orokbefogad-gomb" id="orokbefogadGomb" onclick="
    const nev = document.getElementById('adatlapNev') ? document.getElementById('adatlapNev').textContent : 'Kedvenc';
    sessionStorage.setItem('orokbefogadandoAllat', nev);
    window.location.href = 'orokbefogadas.html';
">Örökbefogadom 🐾</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="api_script.js"></script>
    <script src="script.js"></script>
</body>
</html>
